<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Simon Says</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-container">
        <h1>Simon Says</h1>
        <div class="level">Level: <span id="current-level">0</span></div>

        <div class="grid">
            <div id="red" class="box" data-color="red"></div>
            <div id="green" class="box" data-color="green"></div>
            <div id="blue" class="box" data-color="blue"></div>
            <div id="yellow" class="box" data-color="yellow"></div>
        </div>

        <button id="start-btn" class="start-btn">Start Game</button>
        <div id="message" class="message">Click Start to begin!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
